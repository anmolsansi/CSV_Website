name: Patch C01-C03 development status

on:
  push:
    branches:
      - c01-c03-recovery-closeout
    paths:
      - scripts/patch_c01_c03_development.py
      - .github/workflows/patch-c01-c03-development.yml

permissions:
  contents: write

jobs:
  patch-development:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c01-c03-recovery-closeout
          fetch-depth: 0
      - name: Patch development.md
        run: python scripts/patch_c01_c03_development.py
      - name: Commit development.md
        run: |
          if git diff --quiet -- development.md; then
            echo "development.md already updated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add development.md
          git commit -m "Mark C-01 through C-03 complete"
          git push origin HEAD:c01-c03-recovery-closeout
