name: JG059 E2E patch

on:
  push:
    branches:
      - jg-059-061-import-ui-undo-foundation
    paths:
      - .github/workflows/jg059-e2e-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact E2E repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "frontend/src/components/CsvUpload.jsx",
              'aria-label="Choose CSV or JSON import file"',
              'aria-label="Upload CSV file"',
          )
          replace(
              "frontend/src/components/ImportPreview.jsx",
              "{previewing ? 'Generating preview…' : preview ? 'Regenerate preview' : 'Review import'}",
              "{previewing ? 'Generating preview…' : preview ? 'Review changes again' : 'Review import'}",
          )

          tests = "frontend/tests/import-mapping.spec.ts"
          replace(tests, "getByLabel('Choose CSV or JSON import file')", "getByLabel('Upload CSV file')", expected=3)
          replace(tests, "row.url === 'https://example.test/jobs/renamed-commit'", "row.data?.url === 'https://example.test/jobs/renamed-commit'")
          replace(tests, "row.url === 'https://example.test/jobs/preview-only'", "row.data?.url === 'https://example.test/jobs/preview-only'")
          replace(tests, ".find((row: any) => row.url === url)", ".find((row: any) => row.data?.url === url)", expected=2)
          replace(tests, "expect(after.title).toBe('New Title')", "expect(after.data.title).toBe('New Title')")
          replace(tests, "expect(after.company_guess).toBe('Example Co')", "expect(after.data.company_guess).toBe('Example Co')")
          replace(tests, ".filter((row: any) => row.url === 'https://example.test/jobs/lost-response')", ".filter((row: any) => row.data?.url === 'https://example.test/jobs/lost-response')")

          dashboard = "frontend/tests/dashboard.spec.ts"
          replace(
              dashboard,
              "    await page.waitForSelector('.upload-result', { timeout: 15000 });\n    await expect(page.locator('.upload-result')).toBeVisible();",
              "    await expect(page.locator('.upload-result')).toBeVisible({ timeout: 15000 });\n    await page.getByRole('button', { name: 'Review import' }).click();\n    await expect(page.getByRole('heading', { name: '2. Review changes' })).toBeVisible();\n    await page.getByRole('button', { name: 'Commit reviewed import' }).click();\n    await expect(page.getByRole('heading', { name: 'Import committed' })).toBeVisible();",
          )
          PY
      - name: Remove one-time patch workflow
        run: rm .github/workflows/jg059-e2e-patch.yml
      - name: Commit E2E repairs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/components/CsvUpload.jsx frontend/src/components/ImportPreview.jsx frontend/tests/import-mapping.spec.ts frontend/tests/dashboard.spec.ts .github/workflows/jg059-e2e-patch.yml
          git diff --cached --check
          git commit -m "fix(jg059): align mapped import E2E contract [16/36] (#154)"
          git push origin HEAD:jg-059-061-import-ui-undo-foundation
