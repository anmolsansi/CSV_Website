name: One-time JG-059 through JG-061 roadmap marker

on:
  push:
    branches:
      - jg-059-061-import-ui-undo-foundation

permissions:
  contents: write

jobs:
  mark-roadmap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark canonical roadmap tickets locally complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md')
          text = path.read_text(encoding='utf-8')

          for ticket in ('059', '060', '061'):
              unchecked = f'- [ ] [JG-{ticket} —'
              checked = f'- [x] [JG-{ticket} —'
              if unchecked not in text and checked not in text:
                  raise SystemExit(f'missing roadmap checklist entry for JG-{ticket}')
              text = text.replace(unchecked, checked, 1)

          boundaries = {
              '059': '<a id="jg-060"></a>',
              '060': '<a id="f10"></a>',
              '061': '<a id="jg-062"></a>',
          }
          completed_line = (
              '**COMPLETED LOCALLY; implementation and required repository CI are verified. '
              'Staging acceptance and production release remain separate and are not claimed.**'
          )

          for ticket, next_marker in boundaries.items():
              marker = f'<a id="jg-{ticket}"></a>'
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'missing section for JG-{ticket}')
              end = text.find(next_marker, start)
              if end < 0:
                  raise SystemExit(f'missing end marker for JG-{ticket}')
              section = text[start:end]

              proposed = '**Status:** PROPOSED / unchecked'
              completed = '**Status:** COMPLETED / checked (locally verified)'
              if proposed in section:
                  section = section.replace(proposed, completed, 1)
              elif completed not in section:
                  raise SystemExit(f'unexpected status for JG-{ticket}')

              section = re.sub(r'^- \[ \] ', '- [x] ', section, flags=re.MULTILINE)
              section, count = re.subn(
                  r'^\*\*PLANNED;[^\n]*\*\*$',
                  completed_line,
                  section,
                  count=1,
                  flags=re.MULTILINE,
              )
              if count == 0 and completed_line not in section:
                  raise SystemExit(f'missing intake-result marker for JG-{ticket}')

              text = text[:start] + section + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit roadmap update and remove one-time helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md
          git rm .github/workflows/mark-jg059-061-roadmap.yml
          git diff --cached --check
          git commit -m 'docs: mark JG-059 through JG-061 locally complete'
          git push origin HEAD:jg-059-061-import-ui-undo-foundation
