name: JG-007 one-shot implementation

on:
  push:
    branches: [jg-007-query-serialization]
    paths: ['.github/workflows/jg007-implementation.yml']

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jg-007-query-serialization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Apply JG-007 frontend integration
        shell: bash
        run: |
          python - <<'PY'
