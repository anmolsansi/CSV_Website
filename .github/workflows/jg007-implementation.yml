## JG-007 shared browser and saved-view query serialization

`frontend/src/api/queryParams.js` is the frontend source of truth for Dashboard and Applications query serialization. It accepts the documented camelCase UI names and snake_case wire aliases, normalizes booleans/numbers explicitly, and emits the backend's snake_case query contract.

The same serializer is used for list loads, Dashboard top-five retrieval, filtered exports, and Saved View navigation. Export requests always send an explicit `scope` and sort, never copy `page`/`page_size`, and selected scope sends only the selected owned IDs for backend validation.

Saved Views now serialize their filter state into the destination URL. Dashboard and Applications hydrate their initial filter/sort state from that URL after reload. Unknown keys or invalid booleans/numbers render a recoverable error with a clear action instead of silently ignoring the saved state.

Dashboard and Applications record the last settled browse query. Export is disabled while a browse request is loading, snapshots the current query at click time, and refuses to export if that snapshot does not match the settled result. HTTP export failures show an error and never report a successful download.

Focused verification:

```sh
cd frontend
npm run build
npm run test:e2e -- tests/filter-export-parity.spec.ts --project=chromium
```

