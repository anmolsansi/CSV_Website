          def replace_once(text, old, new, label):
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected one exact match, got {text.count(old)}')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, got {count}')
              return updated

          # queryParams: keep page/filter state separated so sort changes cannot be overwritten by filters.
          path = 'frontend/src/api/queryParams.js'
          text = read(path)
          marker = "function toSearchParams(serialized, viewId) {"
          helper = """function extractFilters(values, fields) {
            const excluded = new Set(['sortBy', 'sortDir', 'page', 'pageSize'])
            const filters = {}
            for (const [canonical] of fields) {
              if (excluded.has(canonical)) continue
              if (Object.prototype.hasOwnProperty.call(values, canonical)) filters[canonical] = values[canonical]
            }
            return filters
          }

          function toSearchParams(serialized, viewId) {"""
          text = replace_once(text, marker, helper, 'queryParams extractFilters')
          text = replace_once(text, '    filters: values,\n    page: values.page ?? defaults.page ?? 1,', '    filters: extractFilters(values, DASHBOARD_FIELDS),\n    page: values.page ?? defaults.page ?? 1,', 'dashboard nav filters')
          text = replace_once(text, '    filters: values,\n    page: values.page ?? defaults.page ?? 1,', '    filters: extractFilters(values, APPLICATION_FIELDS),\n    page: values.page ?? defaults.page ?? 1,', 'application nav filters')
          write(path, text)

