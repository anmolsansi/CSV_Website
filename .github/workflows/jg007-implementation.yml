          text = replace_once(text, "import axios from 'axios'\n", "import axios from 'axios'\nimport { serializeApplicationQuery, serializeDashboardQuery } from './queryParams'\n", 'client import')
          text = sub_once(text,
              r"  getRows: \(\{.*?\n      \.then\(\(r\) => r\.data\),\n  recordClick:",
              """  getRows: (params = {}) =>
            client
              .get('/rows', {
                params: {
                  ...serializeDashboardQuery(params, { includePagination: true, includeFalse: true }),
                  ...todayWindowParams(),
                },
              })
              .then((r) => r.data),
          recordClick:""",
              'client getRows')
          text = sub_once(text,
              r"  getApplications: \(params = \{\}\) => \{.*?\n  \},\n  updateApplication:",
              """  getApplications: (params = {}) =>
            client
              .get('/crm/applications', {
                params: serializeApplicationQuery(params, { includePagination: true, includeFalse: true }),
              })
              .then((r) => r.data),
