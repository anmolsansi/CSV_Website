name: JG-007 one-shot implementation

on:
  push:
    branches:
      - jg-007-query-serialization

permissions:
  contents: write

jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jg-007-query-serialization
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply JG-007 changes
        run: python .github/scripts/jg007_apply_v2.py

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Commit implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/api/queryParams.js frontend/src/api/client.js frontend/src/pages/Dashboard.jsx frontend/src/pages/Applications.jsx frontend/src/pages/SavedViews.jsx docs/JOBGRID_BUILD_GUIDE.md
          git commit -m 'feat(jg-007): unify browser and saved-view queries [28/37] (#44)'
          git push origin HEAD:jg-007-query-serialization
