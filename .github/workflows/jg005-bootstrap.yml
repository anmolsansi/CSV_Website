name: JG-005 implementation bootstrap

on:
  push:
    branches:
      - feat/jg-005-account-scoped-query-builder

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: jobgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Apply JG-005 route integration
        run: python scripts/jg005_finalize.py apply-routes

      - name: Stage route implementation commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/routers/rows.py backend/app/routers/crm.py
          git commit -m "refactor(query): route lists through shared builders [04/05] (JG-005)"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Verify JG-005 backend behavior
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://testuser:testpass@localhost:5432/jobgrid_test
          TEST_AUTH: "true"
          SECRET_KEY: test-secret-key-for-ci
          FRONTEND_URL: http://localhost:5173
          ENVIRONMENT: test
        run: |
          python -m compileall app
          pytest tests/test_query_contracts.py -q
          pytest tests/ -q

      - name: Mark JG-005 complete after tests
        run: python scripts/jg005_finalize.py mark-complete

      - name: Commit verified completion
        run: |
          git add docs/JOBGRID_BUILD_GUIDE.md docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md
          git commit -m "docs(jg-005): record verified completion [05/05] (JG-005)"
          git push origin HEAD:feat/jg-005-account-scoped-query-builder
