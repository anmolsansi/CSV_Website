name: F10 Roadmap Marker

on:
  push:
    branches:
      - jg-062-064-undo-archive-recovery

permissions:
  contents: write

jobs:
  mark-roadmap:
    if: ${{ !contains(github.event.head_commit.message, '[roadmap-marker]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jg-062-064-undo-archive-recovery
          fetch-depth: 0
      - name: Mark JG-062 through JG-064 complete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md')
          text = path.read_text()

          for ticket in ('062', '063', '064'):
              old = f'- [ ] [JG-{ticket}'
              new = f'- [x] [JG-{ticket}'
              if old not in text:
                  raise SystemExit(f'missing ordered checklist entry {old}')
              text = text.replace(old, new, 1)

          bounds = {
              '062': ('<a id="jg-062"></a>', '<a id="jg-063"></a>'),
              '063': ('<a id="jg-063"></a>', '<a id="jg-064"></a>'),
              '064': ('<a id="jg-064"></a>', '<a id="final-release-checklist"></a>'),
          }
          titles = {
              '062': 'Implement transactional bulk changes and conflict-aware undo',
              '063': 'Build Archive and explicit Undo conflict handling',
              '064': 'Prove recovery and decide whether automatic purge is safe',
          }
          for ticket, (start_marker, end_marker) in bounds.items():
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              section = text[start:end]
              section = section.replace('**Status:** PROPOSED / unchecked', '**Status:** COMPLETED / checked (locally verified)', 1)
              section = section.replace('- [ ]', '- [x]')
              section = re.sub(
                  r'- External issue URL:.*',
                  '- External issue URL: GitHub issue #156; implementation PR: #157.',
                  section,
                  count=1,
              )
              section = re.sub(
                  r'\*\*PLANNED; waits for JG-\d{3} local completion, implementation not started\.\*\*.*?(?=\n\n---|\Z)',
                  '**COMPLETED LOCALLY; implementation and required repository CI are verified in PR #157 / CI run #427 on implementation head `b4c605efe33d90a418c49d95b7277d7e5beb078c`. Staging acceptance and production release remain separate and are not claimed.**',
                  section,
                  count=1,
                  flags=re.S,
              )
              if f'### JG-{ticket} — {titles[ticket]}' not in section:
                  raise SystemExit(f'wrong section for JG-{ticket}')
              if '**Status:** COMPLETED / checked (locally verified)' not in section:
                  raise SystemExit(f'status not updated for JG-{ticket}')
              if '- [ ]' in section:
                  raise SystemExit(f'unchecked ticket-local box remains in JG-{ticket}')
              text = text[:start] + section + text[end:]

          for ticket in ('062', '063', '064'):
              if f'- [x] [JG-{ticket}' not in text:
                  raise SystemExit(f'ordered checklist not checked for JG-{ticket}')

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md
          git rm .github/workflows/f10-roadmap-marker.yml
          git commit -m "docs: mark JG-062 through JG-064 complete [roadmap-marker] (#156)"
          git push origin HEAD:jg-062-064-undo-archive-recovery
