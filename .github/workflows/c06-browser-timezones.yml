name: C-06 Browser Timezones

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  c06-browser-timezones:
    name: C-06 Browser Timezones
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jobgrid_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jobgrid_schema_test
      TEST_AUTH: "true"
      SECRET_KEY: c06-ci-browser-time-secret-not-production
      FRONTEND_URL: http://localhost:5173
      ENVIRONMENT: test
      RUN_MAINTENANCE_JOBS: "false"
      DOCUMENT_STORAGE_DIR: /tmp/jobgrid-private-documents
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}
        run: pip install -r backend/requirements.txt

      - name: Start migrated backend server
        working-directory: ${{ github.workspace }}/backend
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/c06-backend.log 2>&1 &
          BACKEND_PID=$!
          READY=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            cat /tmp/c06-backend.log
            exit 1
          fi

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Verify C-06 timezone collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          COLLECTION_OUTPUT="$(npx playwright test --list tests/c06-browser-time.spec.ts --project=chromium --project=chromium-kolkata --project=chromium-new-york)"
          printf '%s\n' "$COLLECTION_OUTPUT" | tee ci-artifacts/c06-timezone-collection.txt
          for project in chromium chromium-kolkata chromium-new-york; do
            if ! printf '%s\n' "$COLLECTION_OUTPUT" | grep -q "\[$project\].*c06-browser-time.spec.ts"; then
              echo "C-06 collection is missing project: $project"
              exit 1
            fi
          done

      - name: Run C-06 timezone contracts
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/c06-browser-time.spec.ts \
            --project=chromium \
            --project=chromium-kolkata \
            --project=chromium-new-york \
            --reporter=line | tee ci-artifacts/c06-timezone-results.txt

      - name: Upload C-06 browser-time evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c06-browser-timezones-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/ci-artifacts/c06-timezone-collection.txt
            frontend/ci-artifacts/c06-timezone-results.txt
            frontend/playwright-report/
            frontend/test-results/
