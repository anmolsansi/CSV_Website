name: Mark JG-001 complete in roadmap

on:
  push:
    branches:
      - chore/mark-jg001-complete

permissions:
  contents: write

jobs:
  mark-complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/mark-jg001-complete
          fetch-depth: 0

      - name: Update JG-001 completion markers
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'Status: **Proposed implementation backlog — no ticket in this document is claimed implemented**',
                  'Status: **Implementation backlog — completed tickets are marked per-ticket below; remaining tickets stay proposed until implemented**',
              ),
              (
                  '| Total | 17 | 64 | All remain proposed |',
                  '| Total | 17 | 64 | JG-001 completed; JG-002–JG-064 remain proposed |',
              ),
              (
                  '- [ ] [JG-001 — Freeze and validate the complete backup v2 record schema](#jg-001)',
                  '- [x] [JG-001 — Freeze and validate the complete backup v2 record schema](#jg-001)',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              text = text.replace(old, new, 1)

          start_marker = '<a id="jg-001"></a>'
          end_marker = '<a id="jg-002"></a>'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          section = text[start:end]

          status_old = '**Status:** PROPOSED / unchecked'
          status_new = '**Status:** COMPLETED / locally verified'
          if section.count(status_old) != 1:
              raise SystemExit(f'Expected one JG-001 status line, found {section.count(status_old)}')
          section = section.replace(status_old, status_new, 1)

          intake_old = '**READY FOR SOURCE INTAKE; implementation not started.** The what/why/when/how, file scope, contract, tests, rollback and acceptance criteria are supplied. Recheck the current source and predecessor evidence at execution time. Do not change this status to Done merely because this planning text exists.'
          intake_new = '**COMPLETED / locally verified.** JG-001 was implemented in PR #27 and merged to `main`. Strict v2 backup schema models, complete ORM field inventory, canonical checksum/reference validation, the loss-aware v1 compatibility adapter, regression coverage, and build-guide documentation are in place. GitHub Actions passed. This completion does not claim JG-002/JG-003 export/import behavior, staging acceptance, or release.'
          if section.count(intake_old) != 1:
              raise SystemExit(f'Expected one JG-001 intake result, found {section.count(intake_old)}')
          section = section.replace(intake_old, intake_new, 1)

          issue_old = '- External issue URL: none created. Publishing or syncing this metadata is outside this document-writing task.'
          issue_new = '- External issue: [#26](https://github.com/anmolsansi/CSV_Website/issues/26), closed as completed.'
          if section.count(issue_old) != 1:
              raise SystemExit(f'Expected one JG-001 external issue line, found {section.count(issue_old)}')
          section = section.replace(issue_old, issue_new, 1)

          # JG-001 has only acceptance/definition-of-done checkboxes. Mark all of them complete.
          unchecked = section.count('- [ ]')
          if unchecked != 13:
              raise SystemExit(f'Expected 13 unchecked JG-001 completion criteria, found {unchecked}')
          section = section.replace('- [ ]', '- [x]')

          text = text[:start] + section + text[end:]
          path.write_text(text, encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          jg1 = updated[updated.index(start_marker):updated.index(end_marker, updated.index(start_marker))]
          assert '**Status:** COMPLETED / locally verified' in jg1
          assert '- [ ]' not in jg1
          assert '- [x] [JG-001 — Freeze and validate the complete backup v2 record schema](#jg-001)' in updated
          assert 'JG-001 completed; JG-002–JG-064 remain proposed' in updated

      - name: Commit roadmap update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mark-jg001-complete.yml
          git add docs/JOBGRID_REMAINING_IMPLEMENTATION_TICKETS_FULL.md
          git commit -m "docs: mark JG-001 complete"
          git push origin HEAD:chore/mark-jg001-complete
