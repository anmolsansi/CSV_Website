name: F8 build guide one-shot

on:
  push:
    branches:
      - jg-053-055-contacts-interviews

permissions:
  contents: write

jobs:
  append-build-guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jg-053-055-contacts-interviews
          fetch-depth: 0
      - name: Append staged guide section
        shell: bash
        run: |
          set -euo pipefail
          marker='## F8 recruiter and interview workspace, JG-053 through JG-055'
          if ! grep -Fq "$marker" docs/JOBGRID_BUILD_GUIDE.md; then
            cat docs/F8_CONTACTS_INTERVIEWS_APPEND.md >> docs/JOBGRID_BUILD_GUIDE.md
          fi
          git rm docs/F8_CONTACTS_INTERVIEWS_APPEND.md .github/workflows/f8-docs-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/JOBGRID_BUILD_GUIDE.md
          git commit -m 'docs(f8): document contacts and interview workspace [29/30] (#149)'
          git push origin HEAD:jg-053-055-contacts-interviews
