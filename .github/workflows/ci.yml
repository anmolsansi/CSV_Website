name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: /api
      VITE_ENABLE_DEV_LOGIN: "false"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

  frontend-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jobgrid_test
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/jobgrid_schema_test
      TEST_AUTH: "true"
      SECRET_KEY: jg021-ci-e2e-test-secret-not-production
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: test
      RUN_MAINTENANCE_JOBS: "false"
      RUN_REMINDER_WORKER: "false"
      REMINDER_EMAIL_DELIVERY_ENABLED: "false"
      JOB_URL_CHECKS_ENABLED: "false"
      SMTP_HOST: ""
      DOCUMENT_STORAGE_DIR: /tmp/jobgrid-private-documents
      VITE_API_URL: http://localhost:8000
      VITE_ENABLE_DEV_LOGIN: "true"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}
        run: pip install -r backend/requirements.txt

      - name: Start migrated backend server
        working-directory: ${{ github.workspace }}/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts

          sanitize_log() {
            sed -E \
              -e 's#(postgresql(\+psycopg2)?://)[^/@[:space:]]+:[^@[:space:]]+@#\1***:***@#g' \
              -e 's#(DATABASE_URL|TEST_DATABASE_URL|SECRET_KEY)=([^[:space:]]+)#\1=***#g'
          }

          if ! python -m alembic upgrade head > /tmp/jobgrid-alembic.log 2>&1; then
            sanitize_log < /tmp/jobgrid-alembic.log > ci-artifacts/alembic.log
            cat ci-artifacts/alembic.log
            exit 1
          fi

          MIGRATION_REVISION="$(python -m alembic current 2>/dev/null | sed -nE 's/^([0-9A-Za-z_-]+).*/\1/p' | head -n 1)"
          if [ -z "$MIGRATION_REVISION" ]; then
            echo "Unable to determine the applied Alembic revision."
            exit 1
          fi
          echo "Migration revision: $MIGRATION_REVISION"

          python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/jobgrid-backend.log 2>&1 &
          BACKEND_PID=$!
          READY=0

          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$BACKEND_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            sanitize_log < /tmp/jobgrid-backend.log > ci-artifacts/backend-server.log
            cat ci-artifacts/backend-server.log
            exit 1
          fi

          {
            echo "source_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "migration_revision=$MIGRATION_REVISION"
          } > ci-artifacts/c07-e2e-runtime.txt

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Record JG-023 browser release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          {
            echo "source_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "playwright=$(npx playwright --version)"
            echo "package_lock_sha256=$(sha256sum package-lock.json | awk '{print $1}')"
            printf "chromium="
            node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); console.log(browser.version()); await browser.close();"
          } > ci-artifacts/jg023-browser-release-evidence.txt

      - name: Run tab-helper safety regressions
        run: node --test unit/open-jobs.test.mjs

      - name: Verify JG-023 browser release collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          COLLECTION_OUTPUT="$(npx playwright test --list tests/release-workflows.spec.ts --project=chromium)"
          printf '%s\n' "$COLLECTION_OUTPUT" | tee ci-artifacts/jg023-playwright-collection.txt
          if ! printf '%s\n' "$COLLECTION_OUTPUT" | grep -Eq 'Total: [1-9][0-9]* tests? in [1-9][0-9]* files?'; then
            echo "JG-023 browser release collection is empty or could not be verified."
            exit 1
          fi

      - name: Run JG-023 browser release workflow
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test tests/release-workflows.spec.ts --project=chromium --reporter=line | tee ci-artifacts/jg023-playwright-focused.txt

      - name: Verify browser test collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          COLLECTION_OUTPUT="$(npx playwright test --list --project=chromium)"
          printf '%s\n' "$COLLECTION_OUTPUT" | tee ci-artifacts/playwright-collection.txt
          if ! printf '%s\n' "$COLLECTION_OUTPUT" | grep -Eq 'Total: [1-9][0-9]* tests? in [1-9][0-9]* files?'; then
            echo "Playwright collection is empty or could not be verified."
            exit 1
          fi

      - name: Run E2E tests
        run: npx playwright test --project=chromium

      - name: Upload JG-023 browser release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg023-browser-release-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            frontend/ci-artifacts/jg023-browser-release-evidence.txt
            frontend/ci-artifacts/jg023-playwright-collection.txt
            frontend/ci-artifacts/jg023-playwright-focused.txt
            frontend/ci-artifacts/playwright-collection.txt
            frontend/ci-artifacts/c07-e2e-runtime.txt

      - name: Sanitize backend logs on failure
        if: failure()
        working-directory: ${{ github.workspace }}/backend
        shell: bash
        run: |
          mkdir -p ci-artifacts
          if [ -f /tmp/jobgrid-backend.log ]; then
            sed -E \
              -e 's#(postgresql(\+psycopg2)?://)[^/@[:space:]]+:[^@[:space:]]+@#\1***:***@#g' \
              -e 's#(DATABASE_URL|TEST_DATABASE_URL|SECRET_KEY)=([^[:space:]]+)#\1=***#g' \
              /tmp/jobgrid-backend.log > ci-artifacts/backend-server.log
          fi

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            backend/ci-artifacts/
            frontend/ci-artifacts/
            frontend/playwright-report/
            frontend/test-results/

  backend:
    name: Backend Compile Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt
      - run: python -m compileall app

  backend-tests:
    name: Backend Tests (pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: jobgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg2://testuser:testpass@localhost:5432/jobgrid_test
      TEST_DATABASE_URL: postgresql+psycopg2://testuser:testpass@localhost:5432/jobgrid_schema_test
      TEST_AUTH: "true"
      SECRET_KEY: jg021-ci-backend-test-secret-not-production
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
      ENVIRONMENT: test
      RUN_MAINTENANCE_JOBS: "false"
      RUN_REMINDER_WORKER: "false"
      REMINDER_EMAIL_DELIVERY_ENABLED: "false"
      JOB_URL_CHECKS_ENABLED: "false"
      SMTP_HOST: ""
      DOCUMENT_STORAGE_DIR: /tmp/jobgrid-private-documents
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Apply migrations and record JG-023 backend release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python -m alembic upgrade head
          MIGRATION_REVISION="$(python -m alembic current 2>/dev/null | sed -nE 's/^([0-9A-Za-z_-]+).*/\1/p' | head -n 1)"
          if [ -z "$MIGRATION_REVISION" ]; then
            echo "Unable to determine the applied Alembic revision."
            exit 1
          fi
          {
            echo "source_sha=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "workflow_sha=${GITHUB_SHA}"
            echo "migration_revision=$MIGRATION_REVISION"
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version)"
            echo "requirements_sha256=$(sha256sum requirements.txt | awk '{print $1}')"
            python - <<'PY'
          import importlib.metadata as metadata
          for package in ("fastapi", "sqlalchemy", "alembic", "pytest", "psycopg2-binary"):
              print(f"{package}={metadata.version(package)}")
          PY
          } > ci-artifacts/jg023-backend-release-evidence.txt

      - name: Verify JG-023 backend release collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            tests/test_release_contracts.py \
            tests/test_backup_restore.py::test_restore_applied_company_notes_and_dates \
            tests/test_filtered_exports.py::test_filtered_export_equals_all_list_pages \
            tests/test_metric_consistency.py::test_shared_metrics_agree_across_analytics_goals_and_weekly \
            tests/test_cleanup_job.py::test_cleanup_failure_not_zero_success \
            tests/test_numeric_sort.py::test_numeric_order_not_lexical \
            --collect-only -q | tee ci-artifacts/jg023-pytest-collection.txt
          if ! grep -Eq '[1-9][0-9]* tests? collected' ci-artifacts/jg023-pytest-collection.txt; then
            echo "JG-023 backend release collection is empty."
            exit 1
          fi

      - name: Run JG-023 backend release contracts
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            tests/test_release_contracts.py \
            tests/test_backup_restore.py::test_restore_applied_company_notes_and_dates \
            tests/test_filtered_exports.py::test_filtered_export_equals_all_list_pages \
            tests/test_metric_consistency.py::test_shared_metrics_agree_across_analytics_goals_and_weekly \
            tests/test_cleanup_job.py::test_cleanup_failure_not_zero_success \
            tests/test_numeric_sort.py::test_numeric_order_not_lexical \
            -q --junitxml=ci-artifacts/jg023-release-contracts.xml
          python ../scripts/verify_junit.py ci-artifacts/jg023-release-contracts.xml \
            --label "JG-023 backend release contracts" --min-tests 1 --max-skips 0

      - name: Verify C-07 backend regression collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            tests/test_complete_backup.py \
            tests/test_backup_contract.py \
            tests/test_document_backup.py \
            tests/test_interview_today.py \
            tests/test_today_api.py \
            tests/test_timestamp_contracts.py \
            --collect-only -q | tee ci-artifacts/c07-backend-regression-collection.txt
          if ! grep -Eq '[1-9][0-9]* tests? collected' ci-artifacts/c07-backend-regression-collection.txt; then
            echo "C-07 restore/backup/queue regression collection is empty."
            exit 1
          fi

      - name: Run C-07 backend release regressions
        shell: bash
        run: |
          set -euo pipefail
          pytest \
            tests/test_complete_backup.py \
            tests/test_backup_contract.py \
            tests/test_document_backup.py \
            tests/test_interview_today.py \
            tests/test_today_api.py \
            tests/test_timestamp_contracts.py \
            -q --junitxml=ci-artifacts/c07-backend-regressions.xml
          python ../scripts/verify_junit.py ci-artifacts/c07-backend-regressions.xml \
            --label "C-07 backend regressions" --min-tests 1 --max-skips 0

      - name: Verify backend test collection is nonempty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          pytest tests/ --collect-only -q | tee ci-artifacts/pytest-collection.txt
          if ! grep -Eq '[1-9][0-9]* tests? collected' ci-artifacts/pytest-collection.txt; then
            echo "Backend test collection is empty."
            exit 1
          fi

      - name: Run pytest
        run: pytest tests/ -v --tb=short --junitxml=ci-artifacts/pytest.xml

      - name: Verify backend JUnit release result
        run: >-
          python ../scripts/verify_junit.py ci-artifacts/pytest.xml
          --label "PostgreSQL backend suite" --min-tests 1 --max-skips 0

      - name: Upload JG-023 backend release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jg023-backend-release-evidence-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            backend/ci-artifacts/jg023-backend-release-evidence.txt
            backend/ci-artifacts/jg023-pytest-collection.txt
            backend/ci-artifacts/jg023-release-contracts.xml
            backend/ci-artifacts/c07-backend-regression-collection.txt
            backend/ci-artifacts/c07-backend-regressions.xml
            backend/ci-artifacts/pytest-collection.txt
            backend/ci-artifacts/pytest.xml

      - name: Upload backend failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-failure-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 7
          path: backend/ci-artifacts/
