name: JG-004 post-restore refresh fix

on:
  push:
    branches:
      - vsc/jg-004-restore-preview-ui
    paths:
      - .github/workflows/jg004-refresh-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vsc/jg-004-restore-preview-ui
          fetch-depth: 0
      - name: Apply exact refresh fix
        run: |
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('frontend/src/pages/Dashboard.jsx')
          text = dashboard.read_text()
          old = "          <BackupRestore onRestored={() => loadRows(sort, filters, 1)} toast={toast} />"
          new = """          <BackupRestore
            onRestored={() => Promise.all([
              loadRows(sort, filters, 1),
              api.getApplications({ page: 1, page_size: 1 }),
              api.getCompanies({ page: 1, page_size: 1 }),
            ])}
            toast={toast}
          />"""
          if text.count(old) != 1:
              raise SystemExit(f'Dashboard replacement count was {text.count(old)}, expected 1')
          dashboard.write_text(text.replace(old, new, 1))

          guide = Path('docs/JOBGRID_BUILD_GUIDE.md')
          text = guide.read_text()
          old = "7. Successful restore refreshes Dashboard rows. If refresh fails, restore success remains"
          new = "7. Successful restore refreshes Dashboard rows and re-fetches Applications and Companies. If refresh fails, restore success remains"
          if text.count(old) != 1:
              raise SystemExit(f'Build guide replacement count was {text.count(old)}, expected 1')
          guide.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/pages/Dashboard.jsx docs/JOBGRID_BUILD_GUIDE.md
          git commit -m "fix(backup): refresh restored application and company views [13/18] (#34)"
          git rm .github/workflows/jg004-refresh-fix.yml
          git commit -m "chore(jg004): remove refresh patch helper (#34)"
          git push origin HEAD:vsc/jg-004-restore-preview-ui
