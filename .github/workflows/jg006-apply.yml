name: JG-006 Apply

on:
  push:
    branches:
      - feat/jg-006-shared-filtered-exports

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/jg-006-shared-filtered-exports
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Shared query ordering
        run: |
          python scripts/apply_jg006.py service
          git add backend/app/services/row_queries.py
          git commit -m "refactor(export): share row ordering for exports [01/04] (#38)"

      - name: Export route contract
        run: |
          python scripts/apply_jg006.py router
          git add backend/app/routers/crm.py
          git commit -m "fix(export): route exports through shared filters [02/04] (#38)"

      - name: Export regressions
        run: |
          python scripts/apply_jg006.py tests
          git add backend/tests/test_filtered_exports.py
          git commit -m "test(export): cover JG-006 filter and safety contract [03/04] (#38)"

      - name: Build guide
        run: |
          python scripts/apply_jg006.py docs
          git add docs/JOBGRID_BUILD_GUIDE.md
          git commit -m "docs(export): document JG-006 contract [04/04] (#38)"

      - name: Remove temporary patch machinery
        run: |
          git rm .github/workflows/jg006-apply.yml scripts/apply_jg006.py
          git commit -m "chore(jg-006): remove temporary patch runner (#38)"

      - name: Push implementation commits
        run: git push origin HEAD:feat/jg-006-shared-filtered-exports
