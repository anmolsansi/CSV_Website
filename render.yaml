services:
  - type: web
    name: jobgrid-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    # Keep the provider liveness probe lightweight. C-09 release acceptance
    # separately exercises /ready, which verifies database + durable storage.
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    # Render Free cannot scale beyond one instance. Keeping this explicit also
    # makes this web service the only possible in-process scheduler owner.
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_AUTH
        value: "false"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render Free storage is ephemeral. Durable document bytes live in the
      # private Supabase Storage bucket through the JobGrid-only Edge Function
      # gateway. app/__init__.py derives gateway auth at process startup from
      # the existing DATABASE_URL password, so no extra Render secret is needed.
      - key: DOCUMENT_STORAGE_BACKEND
        value: gateway
      - key: DOCUMENT_STORAGE_GATEWAY_URL
        value: https://hzcycquvfkqwbqrbvnhe.supabase.co/functions/v1/jobgrid-storage
      - key: DOCUMENT_STAGING_DIR
        value: /tmp/jobgrid-document-cache
      - key: RUN_MAINTENANCE_JOBS
        value: "false"
      - key: RUN_REMINDER_WORKER
        value: "false"
      - key: REMINDER_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: JOB_URL_CHECKS_ENABLED
        value: "false"
      - key: AUTO_ARCHIVE_AFTER_DAYS
        value: "0"
      - key: AUTO_PURGE_AFTER_DAYS
        value: "0"
