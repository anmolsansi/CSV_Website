services:
  - type: web
    name: jobgrid-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    numInstances: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_AUTH
        value: "false"
      # Use a fresh key name so existing services that already have a stale
      # SECRET_KEY placeholder still receive a new Render-generated 256-bit
      # secret on Blueprint sync.
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render Free storage is ephemeral. Durable document bytes therefore live
      # in private S3-compatible object storage (Supabase Storage for C-09).
      - key: DOCUMENT_STORAGE_BACKEND
        value: s3
      - key: DOCUMENT_STORAGE_S3_ENDPOINT
        sync: false
      - key: DOCUMENT_STORAGE_S3_REGION
        sync: false
      - key: DOCUMENT_STORAGE_S3_BUCKET
        value: jobgrid-documents
      - key: DOCUMENT_STORAGE_S3_ACCESS_KEY_ID
        sync: false
      - key: DOCUMENT_STORAGE_S3_SECRET_ACCESS_KEY
        sync: false
      # Local disk is transient staging/cache only and is safe to lose on a
      # Render Free spin-down, restart, or deploy.
      - key: DOCUMENT_STAGING_DIR
        value: /tmp/jobgrid-document-cache
      # C-09 keeps automated destructive/external work opt-in. Render Free is
      # a single instance; it is the designated scheduler owner when enabled.
      - key: RUN_MAINTENANCE_JOBS
        value: "false"
      - key: RUN_REMINDER_WORKER
        value: "false"
      - key: REMINDER_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: JOB_URL_CHECKS_ENABLED
        value: "false"
      - key: AUTO_ARCHIVE_AFTER_DAYS
        value: "0"
      - key: AUTO_PURGE_AFTER_DAYS
        value: "0"
