services:
  - type: web
    name: jobgrid-api
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    numInstances: 1
    disk:
      name: jobgrid-documents
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: TEST_AUTH
        value: "false"
      # Use a fresh key name so existing services that already have a stale
      # SECRET_KEY placeholder still receive a new Render-generated 256-bit
      # secret on Blueprint sync.
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: OAUTH_REDIRECT_BASE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DOCUMENT_STORAGE_DIR
        value: /var/data/jobgrid-documents
      # C-09 keeps automated destructive/external work opt-in. The single
      # backend instance is the designated scheduler owner when C-10 enables it.
      - key: RUN_MAINTENANCE_JOBS
        value: "false"
      - key: RUN_REMINDER_WORKER
        value: "false"
      - key: REMINDER_EMAIL_DELIVERY_ENABLED
        value: "false"
      - key: JOB_URL_CHECKS_ENABLED
        value: "false"
      - key: AUTO_ARCHIVE_AFTER_DAYS
        value: "0"
      - key: AUTO_PURGE_AFTER_DAYS
        value: "0"
